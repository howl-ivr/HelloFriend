# Integración continua de HelloFriend.
# Corre en cada pull request hacia main o develop y en cada push a esas ramas. Si un job falla, el PR no se debe
# integrar (se exige con la protección de ramas, ver docs/guias/contribuir.md).
# El job Backend levanta un MySQL desechable en cada ejecución: nunca se conecta a RDS ni a otra base real.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

# Si se sube otro commit a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        # Misma versión mayor que en local (deploy/docker-compose.local.yml). Si RDS usa otra, cambiar ambas.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-solo-para-ci
          MYSQL_DATABASE: hellofriend_test
          MYSQL_USER: hellofriend
          MYSQL_PASSWORD: ci-solo-para-pruebas
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot-solo-para-ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DB_URL: jdbc:mysql://localhost:3306/hellofriend_test?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true
      DB_USER: hellofriend
      DB_PASSWORD: ci-solo-para-pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Formato, pruebas unitarias y de integración (mvnw verify)
        run: sh mvnw -B verify

  # frontend:
  #   Espacio reservado: el job Frontend se agrega cuando el equipo de frontend defina sus scripts de CI
  #   (hoy solo existen "lint" y "build"). Será un job más de este mismo archivo, con name: Frontend.
