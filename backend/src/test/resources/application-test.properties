# Perfil "test" de las pruebas de integracion (*IT): usa la base hellofriend_test, nunca la de desarrollo.
# TEST_DB_URL, DB_USER y DB_PASSWORD salen del entorno o de backend/.env; en el CI las define ci.yml.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/hellofriend_test?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
# Las pruebas parten de una base sin datos demo, aunque FLYWAY_LOCATIONS (backend/.env) incluya db/datos-prueba.
spring.flyway.locations=classpath:db/migration
# BCrypt con el costo minimo para que las pruebas no tarden; en produccion se usa el valor por defecto (12).
hellofriend.seguridad.costo-bcrypt=4
