# Configuracion del backend de HelloFriend. Todo sale de variables de entorno, con valores por defecto
# pensados SOLO para desarrollo local. En cualquier otro entorno se definen las variables (ver .env.example).
spring.application.name=hellofriend-backend

# Carga opcional de backend/.env desde backend/ o desde la raiz del proyecto (por ejemplo, en un IDE).
# Las variables del entorno tienen prioridad, asi que el despliegue funciona sin .env.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

# MySQL 8.0. Credenciales fuera del repositorio. Nunca apuntar a RDS desde un equipo de desarrollo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hellofriend?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:hellofriend}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo crea Flyway (src/main/resources/db/migration). JPA no lo toca. Fechas en UTC.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
# Si una base local ya aplico los datos de demostracion (db/dev) y arrancas sin esa carpeta, Flyway no se queja.
spring.flyway.ignore-migration-patterns=repeatable:missing

# API REST bajo /api.
server.servlet.context-path=/api
server.port=${PORT:8080}

# Zona horaria del negocio (la usa el bean Clock).
hellofriend.zona-horaria=America/Lima
# JWT: secreto de al menos 32 caracteres (cambiarlo en cualquier despliegue) y horas de vigencia del token.
hellofriend.jwt.secreto=${JWT_SECRET:desarrollo-local-cambiar-este-secreto-de-32+caracteres}
hellofriend.jwt.duracion-horas=${JWT_HORAS:8}
# Origenes del frontend permitidos por CORS (separar con comas). 5173 es el puerto de Vite.
hellofriend.cors.origenes=${CORS_ORIGINS:http://localhost:5173}

# Correo: en local se envia a Mailpit (deploy/docker-compose.local.yml, interfaz en http://localhost:8025).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
hellofriend.correo.remitente=${MAIL_FROM:no-responder@hellofriend.local}
# Recuperacion de contrasena: donde abre el enlace del correo (/restablecer?token=...) y cuanto dura.
hellofriend.frontend.url=${FRONTEND_URL:http://localhost:5173}
hellofriend.recuperacion.minutos=${RECUPERACION_MINUTOS:30}
# El correo es opcional: que su falta no marque la app como caida en /api/actuator/health.
management.health.mail.enabled=false
